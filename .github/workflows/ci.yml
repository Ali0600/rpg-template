name: check

# Every push and pull request runs the same gate a developer runs locally, on a machine
# that has never seen this project before. That is the point: tools/check.sh passing on the
# laptop that wrote the code proves less than it appears to.
#
# ## Why a merge shows TWO `check` runs
#
# Because a merge IS two events: `pull_request` while the branch is open, then `push` when it
# lands on main. They cost about nine minutes each and they are not the same run.
#
#   pull_request  gate + the mutants THIS DIFF could have broken (mutants_scope.sh). Fast,
#                 because somebody is waiting on it to merge.
#   push (main)   gate + ALL of them. Nobody is waiting, and it is the only run that proves
#                 the mutants a change made decorative SOMEWHERE ELSE - which scoping cannot
#                 see by construction.
#
# The main run does two more things the PR run cannot. It is the green signal `pages.yml`
# deploys from, so deleting it would leave the deploy racing the tests instead of waiting for
# them. And it tests the tree that actually exists: the PR run tested a MERGE PREVIEW, so if
# main moved in between, the squashed commit is a tree nobody has ever run the gate against.
#
# The tempting trim - skip check.sh on main and run only the sweep - is self-defeating. The
# sweep passes --assume-green, which is sound only because check.sh has just proven every
# suite green in the same job; without it the sweep has to re-prove each baseline itself, and
# runs the suites anyway.
#
# ## Why a DOCS-ONLY change does not run this at all
#
# A change to prose can break nothing this gate tests, so the paths below skip it - and
# because the ruleset REQUIRES a status named `check`, check-docs.yml answers with the same
# name in seconds, or every docs pull request would wait forever on a check that never comes.
# The two path lists are mirror images and tests/unit/test_ci_paths.gd fails the build when
# they drift apart.
#
# docs/FLOW.md is the exception that proves the design: it is GENERATED from
# tools/flow_model.json and drift-gated, so a hand-edit to it must run the real gate - landing
# one ungated would turn every later run red. The membership test derives that exception from
# the generators themselves, so the next drift-gated doc cannot be forgotten here.
on:
  push:
    branches: [main]
    # Mirrored in pull_request below and inverted in check-docs.yml; order matters, later
    # patterns override earlier ones.
    paths:
      - "**"
      - "!CLAUDE.md"
      - "!README.md"
      - "!docs/**"
      - "docs/FLOW.md" # generated and drift-gated - a hand-edit must run the real gate
  pull_request:
    paths:
      - "**"
      - "!CLAUDE.md"
      - "!README.md"
      - "!docs/**"
      - "docs/FLOW.md"
  workflow_dispatch:

# Least privilege: this job only reads the repo. The Pages deploy lives in its own
# workflow with its own, narrower grants.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1-stable
  # Pinned here rather than fetched from the release's own SHA512-SUMS.txt: a checksum
  # served by the same host as the file it describes cannot detect that host serving a
  # different file. To update, bump GODOT_VERSION and paste the new sum from
  # https://github.com/godotengine/godot-builds/releases/download/<version>/SHA512-SUMS.txt
  GODOT_SHA512: 4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Enough history for a pull request to diff against its own merge base. The default
          # depth of 1 has no merge base at all, and the scoping step would silently select
          # nothing - which would read as "this change needs no mutants".
          fetch-depth: 50

      - name: Cache the Godot binary
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download and verify Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${zip}"
          curl -fsSL --retry 3 --retry-delay 5 -o "$zip" "$url"
          echo "${GODOT_SHA512}  ${zip}" | sha512sum --check --strict
          mkdir -p ~/godot-bin
          unzip -q "$zip" -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Report the engine version
        run: ~/godot-bin/godot --version

      - name: Run the gate
        env:
          # tools/_engine.sh honours GODOT_BIN before any of its search paths, so CI and a
          # laptop run the identical script against different engines.
          GODOT_BIN: /home/runner/godot-bin/godot
        run: tools/check.sh

      # The mutation sweep is split by WHERE it runs, not weakened.
      #
      # A pull request proves the mutants its own diff can have broken - the rows that mutate a
      # file it touched, or that name a suite it touched, plus any row it ADDED. That is the set
      # a change can plausibly have made decorative, and it takes seconds instead of ten minutes.
      #
      # Every merge to main then re-runs all of them, because scoping cannot see a test that
      # went decorative because of a change somewhere else entirely. Nobody is waiting on that
      # run, which is the whole point of putting it there.
      #
      # Note what does NOT move: tools/mutants_aim.sh runs inside check.sh over the WHOLE file
      # on every run of both. That is the check that catches new code stealing an old mutant's
      # aim, it costs under a second, and it has caught that twice.
      #
      # --assume-green on both: check.sh has just proven all 54 suites green in this same job,
      # so re-proving each one before its mutants is 49 engine boots to answer it again.
      - name: Prove the mutants this change could have broken
        if: github.event_name == 'pull_request'
        env:
          GODOT_BIN: /home/runner/godot-bin/godot
          # Through the environment, never interpolated into the script body: a ${{ }} value
          # is pasted as TEXT before bash ever sees it, so anything shell-significant in it
          # would be executed rather than read.
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          git fetch --no-tags --depth=50 origin "$BASE_REF"
          tools/mutants_scope.sh --base "origin/$BASE_REF" > /tmp/scoped.tsv
          rows=$(grep -cvE '^\s*(#|$)' /tmp/scoped.tsv || true)
          echo "selected $rows mutant(s) for this diff:"
          cut -f1,4 /tmp/scoped.tsv | sed 's/^/  /'
          if [ "$rows" -eq 0 ]; then
            echo "nothing this change touches has a mutant - main will run the full sweep."
            exit 0
          fi
          MUTANTS_TSV=/tmp/scoped.tsv tools/mutate_check.sh --assume-green --all

      - name: Prove every mutant still bites
        if: github.event_name != 'pull_request'
        env:
          GODOT_BIN: /home/runner/godot-bin/godot
        run: tools/mutate_check.sh --assume-green --all
