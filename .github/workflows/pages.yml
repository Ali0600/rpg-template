name: pages

# Publishes the playable demo, but ONLY from a green main. `workflow_run` rather than a plain
# `push` trigger is the difference between "the deploy waits for the tests" and "the deploy
# races the tests" - the second one looks identical until the day a red build ships.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.1-stable
  # Both pinned in the repo rather than fetched alongside the download: a checksum served by
  # the same host as the file it describes cannot detect that host serving a different file.
  # To update, bump GODOT_VERSION and paste the new sums from
  # https://github.com/godotengine/godot-builds/releases/download/<version>/SHA512-SUMS.txt
  GODOT_SHA512: 4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9
  TEMPLATES_SHA512: afcc83d8d3d298038f19c58744a0d660fa75dd4baa33cb55d1011bb2565a2a8c2381728924564cb909e37c205a23f21b521b23bd057993afd43ae4da0b2f9d47

jobs:
  build:
    # Never deploy off a red build. workflow_dispatch has no upstream run to inspect, so it is
    # allowed through explicitly rather than by the check being absent.
    #
    # The `event == 'push'` half is not redundant with `branches: [main]` above. That filter
    # matches the triggering run's HEAD BRANCH, and a pull request from a fork whose branch is
    # itself called `main` produces a run with exactly that head branch - so without this, a
    # stranger could deploy their own tree by naming their branch well. A push to main is the
    # only thing that should ever publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run checks out the default branch's HEAD by default, which is not
          # necessarily the commit that was tested. Pin it to the one that went green.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Cache the engine and export templates
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          # The key changed with the contents on purpose: a cache entry is IMMUTABLE for its
          # key, so trimming what goes into it does nothing until the key moves. The old one
          # held every platform's templates - 1.3GB restored on every deploy to export one web
          # build.
          key: godot-web-only-${{ env.GODOT_VERSION }}

      - name: Download and verify Godot and its templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          tpz="Godot_v${GODOT_VERSION}_export_templates.tpz"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fsSL --retry 3 --retry-delay 5 -o "$zip" "$base/$zip"
          curl -fsSL --retry 3 --retry-delay 5 -o "$tpz" "$base/$tpz"
          echo "${GODOT_SHA512}  ${zip}" | sha512sum --check --strict
          echo "${TEMPLATES_SHA512}  ${tpz}" | sha512sum --check --strict

          mkdir -p ~/godot-bin
          unzip -q "$zip" -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          # The engine looks for templates under a directory named for its own version, in
          # the form it reports: "4.7.1.stable", not the release tag "4.7.1-stable".
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p "$dest"
          # Only the web templates. The engine finds a template by looking for one file by
          # name (export_templates/<version>/<name>), so the other platforms' are 1.3GB of
          # cache this workflow can never use. The glob rather than the exact name because
          # which of the eight it wants depends on the preset - this one has thread support
          # off, so it needs web_nothreads_release.zip rather than web_release.zip, and that
          # is the preset's decision to change.
          unzip -q "$tpz" 'templates/web_*' -d /tmp/templates
          mv /tmp/templates/templates/* "$dest"/
          ls -la "$dest"

      - name: Export the web build
        run: |
          # `set +e` is the load-bearing line. GitHub runs every `run:` step with
          # `bash --noprofile --norc -eo pipefail`, so errexit is ALREADY ON before this
          # script starts - writing `set -uo pipefail` does not cancel it, and the export
          # below would kill the shell before the status line could read its code. The exit
          # code is checked by hand here, for the reason spelled out further down.
          set +e
          set -uo pipefail
          mkdir -p build/web
          # NOT swallowed. This used to end in `|| true`, which is a fail-open in the one
          # step that builds what users download: a broken import produces a pack missing its
          # imported resources, and the only symptom downstream was a smaller file.
          #
          # The contrast with the export below is deliberate and worth reading: THAT exit code
          # is ignored for a stated, measured reason (the exporter aborts during shutdown after
          # writing a complete package). This one was ignored out of habit.
          ~/godot-bin/godot --headless --path . --import
          import_status=$?
          if [ "$import_status" -ne 0 ]; then
            echo "the import failed (exit ${import_status}) - the pack would be missing resources"
            exit 1
          fi

          # Run through a wrapper shell so THAT shell, rather than this one, is the one that
          # notices the exporter dying by a signal. Bash prints "Aborted (core dumped)" for a
          # foreground command killed by one, and redirecting the command's own streams does
          # not stop it - the message comes from the shell that waited, not from the program.
          # In this log it reads as a crash nobody handled, next to a comment explaining that
          # the crash is expected, which is the kind of contradiction that teaches people to
          # skim. The wrapper's stderr is discarded and it exits normally; the real status is
          # kept in a file, because it is worth printing.
          bash -c '~/godot-bin/godot --headless --path . --export-release "Web" build/web/index.html; echo $? > /tmp/export_status' 2>/dev/null
          status=$(cat /tmp/export_status 2>/dev/null || echo "?")
          echo "godot --export-release exited ${status}"

          # Godot's headless exporter writes the complete package and THEN aborts during
          # shutdown (SIGABRT, exit 134) on this platform - the log ends with "DONE savepack"
          # and dies cleaning up. So the exit code is not evidence in either direction, and
          # the artifacts are: every file the page needs must exist, and the package must be
          # big enough to be a real one rather than a truncated stub.
          missing=0
          for f in index.html index.js index.wasm index.pck; do
            if [ ! -s "build/web/${f}" ]; then
              echo "MISSING or empty: build/web/${f}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "the export did not produce a runnable page (exit was ${status})"
            exit 1
          fi
          pck_bytes=$(stat -c%s build/web/index.pck)
          if [ "$pck_bytes" -lt 100000 ]; then
            echo "build/web/index.pck is only ${pck_bytes} bytes - the package is truncated"
            exit 1
          fi

          # GitHub Pages runs Jekyll over the artifact unless told not to, and Jekyll drops
          # files beginning with an underscore - which is most of an Emscripten build.
          touch build/web/.nojekyll
          ls -la build/web

      - name: Play the package that is about to be deployed
        env:
          GODOT_BIN: /home/runner/godot-bin/godot
        # The file checks above are liveness: four files exist and the pack is not truncated.
        # They cannot tell a complete package from one missing every sound, which was measured -
        # excluding the cues left a pack that boots, walks, talks and requests every cue exactly
        # as it should, and is silent.
        #
        # This drives THE PACK ABOUT TO SHIP through the real QA harness. `deploy` needs this
        # job, so a package that does not play leaves the live page on the last good build.
        run: tools/pack_check.sh build/web/index.pck

      - name: Package the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
