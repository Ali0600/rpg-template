name: check

# The other half of ci.yml's paths filter, and it exists because of the ruleset: `check` is a
# REQUIRED status, so a pull request that does not produce one cannot merge - it waits forever
# on a check that is never coming. A docs-only change therefore needs a `check` that says yes
# without booting an engine, which is this. Same workflow name, same job name, so the ruleset
# cannot tell the difference - that sameness is the entire mechanism, and it is GitHub's own
# documented pattern for a skipped-but-required check.
#
# The paths here are the exact inverse of ci.yml's, and tests/unit/test_ci_paths.gd fails the
# build when the two lists drift - including the re-included exceptions: docs/FLOW.md is
# generated and drift-gated, so editing it must run the REAL gate, never this one.
#
# A pull request touching docs AND code triggers both workflows. Both then report, and the
# real one finishes last, so the final status is the real one's. The edge to know about: a
# re-run of THIS workflow after the real one failed would overwrite that verdict - so do not
# re-run this one by hand on a red pull request.
on:
  pull_request:
    paths:
      - "CLAUDE.md"
      - "README.md"
      - "docs/**"
      - "!docs/FLOW.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say why this passed without testing anything
        run: |
          echo "Docs-only change: nothing the gate tests can have moved."
          echo "The real gate runs the moment any non-docs file is touched - ci.yml's paths"
          echo "and this file's are mirror images, and test_ci_paths.gd keeps them that way."
